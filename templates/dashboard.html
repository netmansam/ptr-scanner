<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f4f4;
        }

        h1 {
            color: #222;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
        }

        th {
            background: #e8e8e8;
        }
    </style>
</head>

<body>

<h1>PTR Scanner Dashboard</h1>

<p><strong>System Status:</strong> Online</p>

<table>
    <thead>
        <tr>
            <th>Rank</th>
            <th>Ticker</th>
            <th>PTR Score</th>
            <th>Breakout</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td colspan="5" style="text-align:center;">
                Waiting for morning scan...
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
